<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>愛撒すばる</title>

  <style>
    body {
      margin: 0;
      font-family: "Yu Mincho", serif;
      background: #f4f1ec;
      color: #222;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      font-size: 32px;
      letter-spacing: 3px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .new-post {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }

    .post {
      background: white;
      margin-bottom: 12px;
      padding: 15px;
      border-left: 5px solid #999;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .post:hover {
      transform: translateX(4px);
      border-left-color: #444;
    }

    .post a {
      text-decoration: none;
      color: #222;
      font-size: 18px;
    }
  </style>
</head>

<body>

<header>愛撒すばる</header>

<div class="container">

<div class="profile card">
  <a href="https://lit.link/aisatsu_subaru" target="_blank">lit.link</a>
</div>

  <a class="new-post" href="/post">＋ 投稿する</a>

  {% for post in posts %}
    <div class="post">
      <a href="/view/{{ post[0] }}">
        {{ post[1] }}
      </a>
    </div>
  {% endfor %}

</div>

</body>
</html>
